# Pinned so local runs and CI agree regardless of the installed ruff version.
target-version = "py310"
line-length = 120

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "EXE", # flake8-executable
    "RUF", # ruff-specific rules
]
ignore = [
    # The project is Russian-language, so Cyrillic in strings, comments and
    # docstrings is expected: these three rules only flag Cyrillic letters that
    # look like Latin.
    "RUF001",
    "RUF002",
    "RUF003",
]
